modLoader = "javafml"
loaderVersion = "[0,)"
license = "MIT"

[[mods]]
modId = "tfprevived_compat"
version = "${mod_version}"
displayName = "TerraFirmaPunk Revived Compat"
authors = "Mr.101Freaking"
description = '''Recipe compatibility for the TerraFirmaPunk Revived modpack.'''

# Mixins — batches the TFC quern so one grind processes up to 4 chunks at once.
[[mixins]]
config = "tfprevived_compat.mixins.json"

# ── Required dependencies ─────────────────────────────────────────────────────

[[dependencies.tfprevived_compat]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.tfprevived_compat]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.tfprevived_compat]]
modId = "tfc"
type = "required"
versionRange = "[3.0,)"
ordering = "AFTER"
side = "BOTH"

# ── Optional dependencies — load ordering only ────────────────────────────────
# AFTER means tfprevived_compat loads after each of these mods.
# This puts our data pack higher in the stack so our recipe overrides win.

[[dependencies.tfprevived_compat]]
modId = "create"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

